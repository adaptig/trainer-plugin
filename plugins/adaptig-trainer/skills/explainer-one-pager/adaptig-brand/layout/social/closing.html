<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="../adaptig-brand/fonts/fonts.css">
<link rel="stylesheet" href="../adaptig-brand/tokens.css">
<link rel="stylesheet" href="../adaptig-brand/layout/social/social.css">
<script src="../adaptig-brand/layout/social/fit.js"></script>
<!-- closing: charcoal, wordmark in a paper chip, one line, the tulip. Last carousel
     slide. -->
<style>
body, .page { background: var(--charcoal-black); color: var(--paper-beige); }
.tulip { position: absolute; left: -180px; top: -160px; width: 620px; }
.txt { position: absolute; left: 72px; right: 72px; top: 470px; bottom: 140px; overflow: hidden; }
body.square .txt { top: 330px; }
.wm { display: inline-block; padding: 36px 44px; border-radius: 32px; }
.wm img { width: 520px; display: block; }
.h { font-size: 64px; color: var(--paper-beige); margin: 56px 0 20px; max-width: 880px; }
.sub { opacity: .7; }
.counter { opacity: .6; background: none; top: auto; bottom: 80px; padding: 0; }
</style>
</head>
<body class="{{SIZE_CLASS}}"><div class="page">
  <img class="tulip" src="../adaptig-brand/shapes/orange/tulip.png" alt="">
  <div class="txt">
    <div class="wm chip"><img src="../adaptig-brand/logo/adaptig-wordmark.png" alt="Adaptig"></div>
    <div class="h">{{HEADLINE}}</div>
    <div class="sub">{{SUBLINE}}</div>
  </div>
  <div class="counter">{{COUNTER}}</div>
</div></body></html>
