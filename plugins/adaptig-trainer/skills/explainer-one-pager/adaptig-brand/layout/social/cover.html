<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="../adaptig-brand/fonts/fonts.css">
<link rel="stylesheet" href="../adaptig-brand/tokens.css">
<link rel="stylesheet" href="../adaptig-brand/layout/social/social.css">
<script src="../adaptig-brand/layout/social/fit.js"></script>
<!-- cover: full-bleed photo, charcoal gradient band, display headline. The LinkedIn
     default. For a carousel cover keep .counter; for a single image delete it. -->
<style>
.photo { inset: 0; background-image: url("{{PHOTO_SRC}}"); background-position: {{FOCAL}}; }
.band { position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
  background: linear-gradient(to top, rgba(33,33,36,.97) 0%, rgba(33,33,36,.9) 40%, rgba(33,33,36,.55) 70%, rgba(33,33,36,0) 100%); }
.txt { position: absolute; left: 72px; right: 72px; bottom: 96px; max-height: 620px; overflow: hidden; color: var(--paper-beige); }
.h { font-size: 96px; max-width: 900px; color: var(--paper-beige); }
.sub { opacity: .78; }
.mark { right: 72px; bottom: 72px; }
</style>
</head>
<body class="{{SIZE_CLASS}}"><div class="page">
  <div class="photo"></div><div class="band"></div>
  <div class="counter">{{COUNTER}}</div>
  <div class="txt">
    <div class="kicker">{{KICKER}}</div>
    <div class="h">{{HEADLINE}}</div>
    <div class="sub">{{SUBLINE}}</div>
  </div>
  <div class="mark chip"><img src="../adaptig-brand/logo/adaptig-logomark.png" alt="Adaptig"></div>
</div></body></html>
