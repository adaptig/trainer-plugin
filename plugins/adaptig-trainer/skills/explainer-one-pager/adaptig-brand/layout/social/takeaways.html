<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="../adaptig-brand/fonts/fonts.css">
<link rel="stylesheet" href="../adaptig-brand/tokens.css">
<link rel="stylesheet" href="../adaptig-brand/layout/social/social.css">
<script src="../adaptig-brand/layout/social/fit.js"></script>
<!-- takeaways: type on paper, numbered rows, one shape bleeding off the corner.
     Carousel interior slide. Up to three rows; delete unused rows. -->
<style>
.quat { position: absolute; right: -220px; bottom: -200px; width: 640px; }
.txt { position: absolute; left: 72px; right: 72px; top: 96px; bottom: 200px; overflow: hidden; }
.h { font-size: 76px; margin: 18px 0 48px; }
.row { display: flex; gap: 28px; align-items: flex-start; margin: 0 0 34px; max-width: 820px; }
.n { font-family: var(--font-display); font-weight: 700; font-size: 44px; color: var(--orange-peel); min-width: 64px; line-height: 1.2; }
.t { font-size: 38px; line-height: 1.28; font-weight: 500; }
.mark { left: 72px; bottom: 64px; }
.counter.on-paper { right: auto; left: 184px; bottom: 96px; }  /* beside the mark, clear of the shape */
</style>
</head>
<body class="{{SIZE_CLASS}}"><div class="page">
  <img class="quat" src="../adaptig-brand/shapes/light-blue/quatrefoil.png" alt="">
  <div class="txt">
    <div class="kicker">{{KICKER}}</div>
    <div class="h">{{HEADLINE}}</div>
    <div class="row"><div class="n">01</div><div class="t">{{ITEM_1}}</div></div>
    <div class="row"><div class="n">02</div><div class="t">{{ITEM_2}}</div></div>
    <div class="row"><div class="n">03</div><div class="t">{{ITEM_3}}</div></div>
  </div>
  <div class="mark"><img src="../adaptig-brand/logo/adaptig-logomark.png" alt="Adaptig"></div>
  <div class="counter on-paper">{{COUNTER}}</div>
</div></body></html>
